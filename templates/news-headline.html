<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="./global.css" />
        <script src="./webcg-framework.umd.js"></script>
        <style>
            #headline {
                grid-area: main;
                height: 5em;
                display: flex;
                flex-direction: column;
                align-self: flex-end;
            }

            #text {
                padding: 0;

                font-size: 2em;

                interpolate-size: allow-keywords;

                width: max-content;
                height: 66%;
                
                overflow: hidden;

                background: transparent;
            }

            #topic {
                interpolate-size: allow-keywords;
                width: max-content;
                height: 34%;
                padding: 0.1rem 1rem;
            }


            #headline > * {
                transition-property: padding, width, color, opacity;
                transition-duration: 750ms, 750ms, 500ms, 500ms;
                transition-timing-function: ease-in-out;
                transition-delay: 0ms, 0ms, 500ms, 0ms;
                text-wrap-mode: nowrap;

                display: flex;
                align-items: center;
            }

            #headline:not(.active) > * {
                transition-delay: 0ms, 0ms, 0ms, 500ms;
                width: 0%;
                opacity: 0;
                padding: 0rem;
                
            }

            #headline:not(.active) #topic {
                color: transparent;
            }

            #headline #text {
                /* transition-duration: 750ms, 750ms, 500ms, 500ms; */
                opacity: 1;
            }

            #headline:not(.active) #text {
                transition-delay: 0ms, 0ms, 500ms, 500ms;
                opacity: 0;
            }
            

            #headline.active > * {
                opacity: 1;
            }


            #gradient {
                width: 100vw;
                height: 100vh;
                background-image: linear-gradient(to top, #0008, #0000);
                /* background-image: radial-gradient(ellipse farthest-corner at bottom left, #0008, #0000); */
                position: absolute;
                top: 0;
                left: 0;
                transition: opacity 500ms ease-in-out;
                transition-delay: 0;
                opacity: 1;
                z-index: -1;
            }
            #gradient:not(.active) {
                transition-delay: 300ms;
                opacity: 0;
            }

        </style>
    </head>
    <body>
        <main id="news-grid">
            <div id="headline">
                <div id="topic" class="box-with-padding primary"></div>
                <div id="text" class="box-with-padding primary"></div>
            </div>
        </main>
        <div id="gradient"></div>

        <script>
            window.debugData = {
                f0: "Train Derailed",
                f1: "Transport"
            }
            
            const gradient = document.getElementById("gradient");
            const graphic = document.getElementById("headline");
            const textEle = document.getElementById("text");
            const topicEle = document.getElementById("topic");

            webcg.addEventListener("play", () => {
                graphic.classList.add("active");
                gradient.classList.add("active");
            });

            webcg.addEventListener("stop", () => {
                graphic.classList.remove("active");
                gradient.classList.remove("active");
            });

            webcg.addEventListener("data", (data) => {
                if (!("text" in data && "topic" in data)) {
                    data.text = data.f0;
                    data.topic = data.f1;
                }
                textEle.innerText = data.text;
                topicEle.innerText = data.topic;
            });
        </script>
    </body>
</html>
